---
- name: Converge
  hosts: all
  gather_facts: true

  pre_tasks:
    - name: Update cache (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts.os_family == "Debian"

  roles:
    - role: leberkaslabs.filesystem
      vars:
        filesystem_list:
          - dev: molecule01
            fstype: ext4
          - dev: molecule02
            fstype: xfs
          - dev: molecule03
            state: absent
